# Render Blueprint: New > Blueprint > pick this repo. Free plan, no credit card needed.
services:
  - type: web
    name: ajaia-docs
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    # Run node directly (not via npm) to save ~40 MB on the 512 MB free instance.
    startCommand: node server/src/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # REQUIRED on Render's free plan: a Postgres URL (Supabase session pooler / Neon).
      # The embedded PGlite fallback peaks at ~1 GB while creating a fresh database, and the free
      # instance (512 MB, wiped on every deploy) runs out of memory. PGlite is for local dev/tests.
      - key: DATABASE_URL
        sync: false
